; cloud-media 客户端配置（可选）
;
; 查找顺序：
;   1. 命令行 --config <路径>
;   2. exe 同目录 client.conf
;   3. %APPDATA%\cloud-media\client.conf
;
; 优先级：命令行参数 > 本文件 > 内置默认值（127.0.0.1:8004）
;   例：本文件写 192.168.142.131，启动时加 --host 10.0.0.5 则以 10.0.0.5 为准
;
; 口令不写在这里（明文落盘不安全）：用 --password / --password-env，
; 或者留空 tel 让登录框自己输。
;
; 改完想确认当前生效值：cloud-media-client.exe --print-config

[client]
; 连本机 Docker 用 127.0.0.1；连 VMware 里的服务端用虚拟机 IP
host = 127.0.0.1
port = 8004

; 预填手机号（可留空）。填了也要在登录框输密码，除非命令行给了 --password
tel =
