; cloud-media 服务端配置（Docker 专用；键名以 common/config/server_config.cpp 为准）
[server]
listen_ip = 0.0.0.0
listen_port = 8004
io_threads = 2
worker_threads = 4
data_dir = /data

[log]
path = /data/logs/server.log
level = info
max_size_mb = 64
roll_days = 3
async = true

[mysql]
host = mysql
port = 3306
user = cm_app
password = cm_app_pw
database = cloud_media

[redis]
host = redis
port = 6379
db = 0

[transfer]
download_dir = /data/downloads
max_connections_per_file = 4
max_concurrent_files = 2
