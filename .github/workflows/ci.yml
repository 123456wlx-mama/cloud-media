name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # MySQL 用服务容器：root 口令已知、端口稳定、就绪由 health check 保证，
    # 绕开 runner 预装 MySQL 的 auth_socket/未知 root 口令问题。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cloud_media_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      # CI 临时测试库口令；不是生产密钥，VM/本地不依赖此值。
      CM_MYSQL_PASSWORD: cm_test_pw_ci
      CM_TEST_MYSQL_USER: cm_test
      CM_TEST_MYSQL_DB: cloud_media_test
      CM_TEST_REDIS: "1"
      CI_JOBS: "4"

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ make lcov \
            redis-server \
            default-libmysqlclient-dev libhiredis-dev

      - name: start redis
        run: |
          sudo service redis-server start || sudo systemctl start redis-server
          redis-cli ping

      - name: init test database
        run: |
          set -euo pipefail
          # MySQL 服务容器已就绪（health check），root 口令来自 services.mysql.env
          mysql -h 127.0.0.1 -uroot -proot <<'SQL'
          CREATE USER IF NOT EXISTS 'cm_test'@'%' IDENTIFIED WITH mysql_native_password BY 'cm_test_pw_ci';
          GRANT ALL PRIVILEGES ON cloud_media_test.* TO 'cm_test'@'%';
          FLUSH PRIVILEGES;
          SQL
          mysql -h 127.0.0.1 -ucm_test -p"$CM_MYSQL_PASSWORD" cloud_media_test < sql/schema_v2.sql
          mysql -h 127.0.0.1 -ucm_test -p"$CM_MYSQL_PASSWORD" cloud_media_test < sql/patch_v2_1_index.sql
          mysql -h 127.0.0.1 -ucm_test -p"$CM_MYSQL_PASSWORD" cloud_media_test < sql/patch_v2_2_phase5.sql

      # 与 VM 对齐：显式 C++11；项目的 cmake/compiler_flags.cmake 也是 11。
      # g++11 可能比 g++5.4 多出警告；项目未开 -Werror，warnings 不阻断。
      - name: ci (build + ctest + coverage gate)
        env:
          CI_BUILD_DIR: ${{ github.workspace }}/build-ci
        run: |
          cmake -S . -B build-ci \
            -DBUILD_SERVER=ON -DBUILD_STORAGE=ON -DBUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON -DENABLE_DB_INTEGRATION_TESTS=ON \
            -DCMAKE_CXX_STANDARD=11 -DCMAKE_CXX_EXTENSIONS=OFF
          bash scripts/ci.sh
